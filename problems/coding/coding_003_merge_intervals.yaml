id: coding_003_merge_intervals
created: "2026-09-20"
title: Merge Intervals
prompt: |
  Given an array of intervals where `intervals[i] = [start_i, end_i]`,
  merge all overlapping intervals and return the array of non-overlapping
  intervals in sorted order.

  Implement a function `merge(intervals)` that returns the merged
  intervals.

  Example:
  merge([[1, 3], [2, 6], [8, 10], [15, 18]]) returns [[1, 6], [8, 10], [15, 18]]
  merge([[1, 4], [4, 5]]) returns [[1, 5]]

  You must implement the solution in a file called solution.py.
  Return only a single Python code block, no prose.
test_file: problems/coding/test_coding_003.py
