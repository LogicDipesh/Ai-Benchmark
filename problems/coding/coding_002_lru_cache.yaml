id: coding_002_lru_cache
created: "2026-09-20"
title: LRU Cache
prompt: |
  Implement an LRU (Least Recently Used) cache with `get` and `put`
  operations. The cache has a fixed capacity.

  class LRUCache:
      def __init__(self, capacity: int):
          self.capacity = capacity

      def get(self, key: int) -> int:
          # Return the value if key exists, otherwise -1.
          # Mark the key as recently used.

      def put(self, key: int, value: int) -> None:
          # If the key exists, update its value and mark as recently used.
          # If the key doesn't exist:
          #   - If at capacity, evict the least recently used item.
          #   - Add the new key-value pair.

  When a key is accessed (get or put), it becomes the most recently used.
  You must implement the solution in a file called solution.py.
  Return only a single Python code block, no prose.
test_file: problems/coding/test_coding_002.py
