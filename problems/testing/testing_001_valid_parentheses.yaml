id: testing_001_valid_parentheses
created: "2026-09-20"
title: Write Tests for Valid Parentheses
prompt: |
  Write comprehensive tests for the following function:

  def is_valid(s):
      stack = []
      mapping = {')': '(', '}': '{', ']': '['}
      for char in s:
          if char in mapping.values():
              stack.append(char)
          elif char in mapping.keys():
              if not stack or stack.pop() != mapping[char]:
                  return False
          else:
              return False
      return not stack

  The function checks if a string of parentheses is valid.
  Write tests covering edge cases. Output only the test code
  in a Python code block.
reference_implementation: |
  def is_valid(s):
      stack = []
      mapping = {')': '(', '}': '{', ']': '['}
      for char in s:
          if char in mapping.values():
              stack.append(char)
          elif char in mapping.keys():
              if not stack or stack.pop() != mapping[char]:
                  return False
          else:
              return False
      return not stack
