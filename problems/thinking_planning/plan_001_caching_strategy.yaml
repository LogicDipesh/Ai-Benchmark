id: plan_001_caching_strategy
created: "2026-09-20"
title: Caching Strategy for High-Traffic API
prompt: |
  You are the lead engineer for a web service that serves 10,000
  requests per second. Each request requires looking up user
  preferences from a database. The data is mostly read-heavy with
  occasional writes when users update their preferences.

  Design a caching strategy to reduce database load. Discuss:
  1. What cache invalidation approach you would use
  2. How you would handle cache stampedes
  3. What happens when a cache node fails
  4. How you would monitor cache effectiveness

  Be specific about tradeoffs and implementation details.
judge_rubric: |
  Score 1.0 if the response addresses all four points with specific,
  technically sound reasoning about tradeities. Score 0.7 if three
  points are well addressed. Score 0.4 if two points are addressed.
  Score 0.1 if only one point is addressed. Score 0.0 if the response
  is incoherent or ignores the prompt.
